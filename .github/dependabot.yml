# Dependabot reads the pnpm catalog in pnpm-workspace.yaml, which is where
# every external version lives (package.json files carry only `catalog:`), so
# a bump here is a bump for the whole workspace at once.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The same supply-chain delay pnpm applies at install (`minimumReleaseAge:
    # 1440`, one day, in pnpm-workspace.yaml): a newly published version has
    # a window to be pulled before Dependabot proposes it. First-party
    # releases are exempt on both sides, so this workspace can pick up an
    # app-repo or sibling-library release the day it lands.
    cooldown:
      default-days: 1
      exclude:
        - '@thomasfosterau/*'
    # Packages that only work as a set are grouped so one PR moves them
    # together; a lone bump of any of them fails install or the browser suite.
    groups:
      # `prosekit` and `@prosekit/pm` (ProseMirror re-published as one
      # package) move together — the node and mark specs here are written
      # against both.
      prosekit:
        patterns:
          - prosekit
          - '@prosekit/*'
      # The Svelte compiler, SvelteKit (`svelte-kit sync` + `svelte-package`),
      # the Vite plugin and svelte-check all pin against one another.
      svelte:
        patterns:
          - svelte
          - svelte-check
          - '@sveltejs/*'
      # `vite` is vite-plus's own core republished under an alias, so the two
      # move as one. `vitest` and `@vitest/*` are deliberately NOT here: they
      # are ignored below and follow vite-plus's exact pin by hand (see that
      # ignore). `playwright` is ignored below too.
      vitest-toolchain:
        patterns:
          - vite
          - vite-plus
          - vitest-browser-svelte
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
      # The flowchart package's required peer, plus its dev copy.
      xyflow:
        patterns:
          - '@xyflow/*'
    # `prosemirror-model` and `prosemirror-view` are pinned EXACTLY under
    # `overrides:` in pnpm-workspace.yaml: the derivation in `./derive` walks
    # ProseMirror's compiled schema, and a stored document is only guaranteed
    # to decode identically while that model is the same (see
    # packages/prosekit-utilities/CLAUDE.md § Invariants — a bump is a major
    # changeset, decided by a person). Scoped to the version update
    # types rather than a bare ignore, so a security advisory against either
    # still gets a Dependabot PR.
    ignore:
      - dependency-name: prosemirror-model
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: prosemirror-view
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # `playwright` is pinned EXACTLY and behind the app repos on purpose:
      # agent sessions reach its Chromium revision through the SessionStart
      # hook's symlink bridge to the image's older build (see the `playwright`
      # entry in pnpm-workspace.yaml), so a bump moves the hook's revision
      # with it and is made by a person. Same update-type scoping as above.
      - dependency-name: playwright
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # vite-plus pins `vitest` and the `@vitest/*` runtime packages EXACTLY,
      # and the catalog's `vitest`, `@vitest/browser-playwright` and
      # `@vitest/coverage-istanbul` must equal that pin (see the `vite-plus`
      # entry in pnpm-workspace.yaml). A group only moves what has a newer
      # release, so a vitest release that no vite-plus pins yet would arrive
      # alone and leave the tree split (#60). So they never move on their own:
      # when Dependabot proposes a vite-plus bump, the same PR gets a hand edit
      # moving the vitest set in the catalog to the new vite-plus's
      # `dependencies.vitest`, plus the regenerated lockfile. Same update-type
      # scoping as above, so security updates stay enabled.
      - dependency-name: vitest
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@vitest/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # `typescript` (the TS6 JS-API alias that svelte-check and the
      # declaration emit load) and `@typescript/native` (TS7, the `tsc` the
      # core type-checks with) are a pair that moves by hand, together and
      # deliberately, not onto whatever npm's `latest` happens to be (see both
      # entries in pnpm-workspace.yaml). If this workspace adopts
      # `@effect/tsgo`, it joins this pair and gets the same ignore. Same
      # update-type scoping as above, so security updates stay enabled.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@typescript/native'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  # The SHA-pinned actions in .github/workflows. Dependabot updates the SHA
  # and the trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
