name: CI

# One workflow, one command: after checkout and setup, every gate is
# `vp run ci` (the `ci` task in vite.config.ts, AGENTS.md § Verification's
# steps 1–8 in order), so a local run and CI are the same thing. It runs on
# the current Node LTS line and the latest stable line, which `engines.node`
# both covers. Each leg is its own check, `ci (node <leg>)`; a ruleset
# requires every leg by name.
#
# Two CI-only steps provision rather than gate, so they stay steps: the Vite+
# task cache restore, and Chromium for the Svelte packages' browser suites
# (`--with-deps` installs apt libraries, which a dev machine or an agent
# session does not want; a session borrows the image's build through the
# SessionStart hook's bridge).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  # A manual run, for the "chore: version packages" PR. changesets/action
  # pushes that branch with GITHUB_TOKEN, and GitHub starts no workflow for a
  # GITHUB_TOKEN push, so the PR's head never gets these checks by itself.
  # Run this workflow on `changeset-release/trunk` from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Vite+ aliases (`vp env use`): `lts` is the newest LTS line,
        # `latest` the newest stable line; pre-releases are never selected.
        node: [lts, latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ (the catalog's `vite-plus` pin), the matrix's Node, the pnpm
      # that `packageManager` pins, the pnpm store cache and a frozen-lockfile
      # `vp install`. Install scripts run: the root `prepare` patches the
      # native `tsc` and vite-plus's `oxlint` with `@effect/tsgo`, which the
      # gates need. Dependency build scripts stay gated by `allowBuilds` in
      # pnpm-workspace.yaml. An exact tag, not a SHA, by the owner's decision
      # (.github/zizmor.yml says why).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Node version
        run: node --version

      # The Vite+ task cache: a gate whose inputs are unchanged since the
      # last run on this runner OS and Node replays instead of rerunning.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-

      # Chromium + its apt system libraries, at exactly the revision the
      # pinned `playwright` expects.
      - name: Install Chromium for the browser suites
        run: pnpm exec playwright install --with-deps chromium

      - name: CI
        run: vp run ci
