name: CI

# ONE job, ONE required check. The pipeline is a short, ordered list of the
# same gates a human runs before pushing — there is no stage to deploy, no
# credential to inject and no service to provision, so nothing here needs a
# `needs:` graph.
#
# The one step that is CI-only is the Playwright browser install: the Svelte
# packages' `test:unit` drives real Chromium, which a fresh runner lacks. A
# dev machine installs it once; an agent session borrows the image's older
# build, which the SessionStart hook (.claude/hooks/session-start.sh,
# section 4) bridges to the revision the pinned `playwright` expects (see
# that entry in pnpm-workspace.yaml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before Node so setup-node's `cache: pnpm` can resolve the store
      # path. The pnpm version comes from the `packageManager` field in
      # package.json — do not pin it here as well, or the two drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: pnpm

      # --ignore-scripts blocks dependency lifecycle scripts (a common
      # supply-chain attack vector) from running in CI; the native binaries
      # the toolchain needs (`@tailwindcss/oxide`, `esbuild`) arrive as
      # platform-specific optional dependencies, so nothing here relies on a
      # postinstall. --frozen-lockfile fails if pnpm-lock.yaml is out of sync
      # with the manifests.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `vp`, `svelte-check`, `svelte-package`, `storybook` and `playwright`
      # all land in node_modules/.bin, which is on nobody's PATH by default.
      - name: Put the toolchain on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # Chromium + its apt system libraries, at exactly the revision the pinned
      # `playwright` expects. CI-only: a dev machine runs `playwright install`
      # once, and an agent session points PLAYWRIGHT_BROWSERS_PATH at the
      # SessionStart hook's bridge to the image's older build (section 4).
      - name: Install Chromium for the browser suites
        run: pnpm exec playwright install --with-deps chromium

      - name: Format and lint
        run: vp check

      - name: Type check
        run: vp run check

      # The core's node suite runs ONCE, under istanbul coverage, so the
      # thresholds in packages/prosekit-utilities/vite.config.ts (statements
      # 90 / branches 85 / functions 90 / lines 90) fail the job when they
      # are missed. The Svelte packages' browser suites keep plain
      # `test:unit`; the `!` filter selects every package but the core.
      - name: Unit tests with coverage thresholds (the core, node)
        run: vp run --filter ./packages/prosekit-utilities test:coverage

      - name: Unit tests (the Svelte packages, browser)
        run: vp run --filter '!./packages/prosekit-utilities' test:unit

      - name: Build the libraries
        run: vp run -r build

      # Reads the dist/ the step above wrote: the core's `.`, `./derive` and
      # `./drizzle` must reach no ProseKit, and the flowchart's `./node` no
      # Svelte or xyflow, and every emitted module must be side-effect-free
      # (scripts/check-dist-boundaries.ts). Its `build` dependencies are cache
      # hits here.
      - name: Entry-point boundaries and side effects (built dist/)
        run: vp run check:dist

      - name: Build Storybook
        run: vp run --filter ./packages/prosekit-svelte storybook:build
