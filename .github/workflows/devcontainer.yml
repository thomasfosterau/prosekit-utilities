name: Dev Container

# Builds and starts .devcontainer/ the way Codespaces does, then checks the
# toolchain inside it. Runs only when something the container uses changes.

on:
  pull_request:
    branches: [trunk]
    paths:
      - '.devcontainer/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  push:
    branches: [trunk]
    paths:
      - '.devcontainer/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  devcontainer:
    name: build and provision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVCONTAINER_CLI: '@devcontainers/cli@0.89.0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
      # Dependabot moves the catalog's `vite-plus` but not the image tag.
      - name: Check the image tag is the catalog's vite-plus pin
        run: |
          pin="$(sed -nE 's/^  vite-plus: "?([0-9]+\.[0-9]+\.[0-9]+)"?$/\1/p' pnpm-workspace.yaml | head -1)"
          tag="$(sed -nE 's#^  "image": "ghcr\.io/voidzero-dev/vite-plus:([^"]+)",?$#\1#p' .devcontainer/devcontainer.json)"
          if [ -z "$pin" ] || [ "$tag" != "$pin" ]; then
            echo "::error file=.devcontainer/devcontainer.json::set the image to ghcr.io/voidzero-dev/vite-plus:$pin"
            exit 1
          fi
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Check the container is provisioned
        run: |
          run() { vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc "$1"; }
          set -x
          run 'vp --version'
          run 'node --version'
          run 'test -x node_modules/.bin/vp'
          run 'gh --version && rg --version && jq --version && claude --version'
