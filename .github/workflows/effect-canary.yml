name: Effect Canary

# Runs the core package's gate against the newest Effect release (the
# `latest` npm dist-tag) instead of the version pinned in the catalog, so
# upstream breakage surfaces here on a schedule rather than in a consumer's
# build.
# Two published entries import Effect: the core package and
# `@thomasfosterau/prosekit-flowchart/node`. The whole workspace is floated,
# but this job checks the core only; checking the flowchart package too is
# tracked in #28.
#
# Scheduled + manual only — this never runs on push or pull_request, so a red
# run can never block a PR merge. The job still finishes red in the Actions
# tab (see the final step) and files/refreshes a GitHub issue, because nobody
# watches the Actions tab for a weekly cron.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: effect-canary-${{ github.ref }}
  cancel-in-progress: true

# No permissions by default; the single job grants only what it needs.
permissions: {}

jobs:
  canary:
    name: Typecheck, test & build the core against effect@latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # to file/refresh the failure-notification issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      # Float the workspace onto the newest Effect release. `effect` is a
      # catalog singleton (every package.json says `catalog:` and the
      # `overrides` block forces every resolution to it), so the one place to
      # change is the catalog entry in pnpm-workspace.yaml; `catalogMode:
      # strict` would reject a `pnpm add` of an off-catalog version. The
      # `latest` dist-tag is the stable 4.x line the catalog pins (see the
      # `effect` entry). The `rc` tag stopped moving when 4.0.0 shipped, so
      # floating onto it would only re-test (or downgrade below) the pin; the
      # `snapshot` tag is per-commit and not a release. Switch the tag here
      # (and in the job name and issue title below) if the project starts
      # tracking a prerelease line such as `next` or `beta`. The one-day
      # `minimumReleaseAge` hold is lifted for this install only: the whole
      # point of the canary is the version published today.
      # --ignore-scripts blocks dependency lifecycle scripts (a common
      # supply-chain attack vector) from running.
      - name: Install dependencies against the latest Effect release
        run: |
          set -euo pipefail
          version=$(npm view effect@latest version)
          echo "effect@latest is $version"
          sed -i "/^catalog:/,/^overrides:/ s/^  effect: .*$/  effect: $version/" pnpm-workspace.yaml
          grep -n '^  effect: ' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0

      # `vp` and `tsc` land in node_modules/.bin, which is on nobody's PATH by
      # default.
      - name: Put the toolchain on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # The three checks most likely to catch an Effect API/behaviour break in
      # the core package. Lint and formatting are deliberately skipped: they
      # have nothing to do with the Effect version and would only add
      # unrelated noise to a canary result. Each step runs even if an earlier
      # one fails, so a single run reports typecheck/test/build status
      # independently.
      - name: Type-check the core package
        id: typecheck
        continue-on-error: true
        run: vp run --filter ./packages/prosekit-utilities check

      - name: Test the core package
        id: test
        continue-on-error: true
        run: vp run --filter ./packages/prosekit-utilities test:unit

      # `vp pack` emits the declarations consumers see; a break in the emitted
      # `.d.ts` is a break in the published package.
      - name: Build the core package
        id: build
        continue-on-error: true
        run: vp run --filter ./packages/prosekit-utilities build

      - name: Open or refresh an issue if the canary is red
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail

          title="Effect canary is red against effect@latest"

          body=$(jq -n \
            --arg run "$RUN_URL" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            --arg test "$TEST_OUTCOME" \
            --arg build "$BUILD_OUTCOME" \
            '"The scheduled Effect canary failed against the latest `effect` release (the `latest` npm dist-tag) for `@thomasfosterau/prosekit-utilities`.\n\n" +
             "- typecheck: " + $typecheck + "\n" +
             "- test: " + $test + "\n" +
             "- build: " + $build + "\n\n" +
             "Run: " + $run + "\n\n" +
             "This does not block any PR by itself — it means the newest Effect release breaks the core package, so the next catalog bump will too. Investigate the run, then either fix the break ahead of the bump or close this out if it turns out to be a fluke in that release."')

          existing=$(curl -sS -G \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "q=repo:$REPO type:issue state:open in:title \"$title\"" \
            "https://api.github.com/search/issues" | jq -r '.items[0].number // empty')

          if [ -n "$existing" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$existing/comments" \
              -d "{\"body\": $body}"
          else
            payload=$(jq -n --arg title "$title" --argjson body "$body" '{title: $title, body: $body}')
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$payload"
          fi

      # continue-on-error above keeps the job running through all three
      # checks so the issue body above has full information; this step turns
      # that into a real (visible, red) job failure once we're done.
      - name: Fail the job if any check failed
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
