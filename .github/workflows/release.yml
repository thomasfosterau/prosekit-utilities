name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance — `pnpm publish --provenance` mints an
      # OIDC token to attest the build.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version Packages" pull request while unreleased
      # changesets exist, and publishes once that pull request is merged. The
      # publish path runs `vp run -r build` first (see the root `release`
      # script) — `files` is `["dist"]`, so a stale or missing build publishes
      # an empty package rather than failing.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
