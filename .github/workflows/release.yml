name: Release

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/prosekit-utilities'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires manual approval via a protected GitHub Environment named
    # "release". The one-time owner setup is in README.md § Releasing.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before a
      # top-level `pnpm run` (`pnpm run version` / `pnpm run release`) it
      # compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install runs the root `prepare` (`vp config`) and
      # the `allowBuilds` dependencies' build scripts (`esbuild`,
      # `@tailwindcss/oxide`) inside this job, which holds `id-token: write`.
      # It triggers whenever a manifest's mtime moves after the install step,
      # e.g. a `git checkout` / `git reset --hard` by the Changesets action
      # before `pnpm run version`. Commands nested inside a `pnpm run` script
      # (scripts/release.sh's `pnpm -r exec` / `pnpm pack`) already inherit
      # `pnpm_config_verify_deps_before_run=false` from pnpm, so the top-level
      # calls are the entry points. Scoped to this job: CI and local runs keep
      # the default. pnpm 11 reads only the `pnpm_config_*` spelling for this
      # setting; `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The root `release` script publishes each `pnpm pack` tarball with the
      # npm CLI (`npm publish`), and npm's own OIDC trusted publishing needs
      # npm >= 11.5.1. The npm bundled with Node `latest` already meets that
      # floor (Node 26.11 ships npm 11.20.0), but which npm that is moves with
      # every Node release. Pinned to an exact version rather than `@latest`,
      # so what runs in this id-token job is a version that was reviewed, not
      # whatever the registry or the Node release serves on the day (`@latest`
      # is already npm 12). Bump it by hand; Dependabot does not see it.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips the root `prepare` (the Vite+ git hooks), which nothing here needs.
      # It only holds because `pnpm_config_verify_deps_before_run` is off for
      # this job (see the job `env` above); otherwise a later `pnpm run` /
      # `pnpm exec` could re-install with scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `vp`, `svelte-package` and friends land in node_modules/.bin, which is
      # on nobody's PATH by default.
      - name: Put the toolchain on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # `files` is `["dist"]` in every package, so a stale or missing build
      # publishes an empty package rather than failing — build here, before
      # the action decides whether this push versions or publishes.
      - name: Build
        run: vp run -r build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release` (scripts/release.sh), which skips any
      # package already on npm at its version, packs the rest with `pnpm pack
      # --config.ignore-scripts=true` (rewriting `workspace:*` and `catalog:`
      # specifiers to real ranges — a thing `npm publish` on the source tree
      # would not do), publishes each tarball with `npm publish` (OIDC trusted
      # publishing — there is no NPM_TOKEN to steal) and then runs
      # `changeset tag`. The action parses the
      # "New tag:" output, pushes the tags and creates the GitHub releases.
      #
      # Provenance is left to npm: with no explicit provenance setting, npm
      # (>= 11.5.1, under trusted publishing) attaches it only when the OIDC
      # token reports a public repository AND the registry reports the
      # package as public. This repository is private, so there is no
      # provenance today. Do not force it: `NPM_CONFIG_PROVENANCE=true` or
      # `--provenance` is read by the npm CLI and makes the publish FAIL from
      # a private repository.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
