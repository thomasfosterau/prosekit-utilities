name: Release

# Changesets, split so only publishing waits for approval: `select` decides
# the mode, `version` opens the "chore: version packages" PR, and `publish`
# (the only job with `id-token: write`, in the protected `release`
# environment) publishes via npm trusted publishing. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

# pnpm 11 re-installs WITH lifecycle scripts before a top-level `pnpm run`
# when a manifest looks newer than the install, which would undo
# `--ignore-scripts` in these jobs.
env:
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/prosekit-utilities' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Create or update the version PR
        id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      # Trusted publishing needs npm >= 11.5.1.
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      # `files` is `["dist"]`: a missing build would publish empty packages.
      - name: Build
        run: vp run -r build
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
