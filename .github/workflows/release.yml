name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/prosekit-utilities' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # Nor for Dependabot: it never pushes to `trunk`, and this job holds
    # `id-token: write`, so the guard is belt and braces.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". The one-time owner setup is in PUBLISHING.md.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before a
      # top-level `pnpm run` (`pnpm run version` / `pnpm run release`) it
      # compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install runs the root `prepare` (`vp config`) and
      # the `allowBuilds` dependencies' build scripts (`esbuild`,
      # `@tailwindcss/oxide`) inside this job, which holds `id-token: write`.
      # It triggers whenever a manifest's mtime moves after the install step,
      # e.g. a `git checkout` / `git reset --hard` by the Changesets action
      # before `pnpm run version`. Commands nested inside a `pnpm run` script
      # (scripts/release.sh's `pnpm -r exec` / `pnpm pack`) already inherit
      # `pnpm_config_verify_deps_before_run=false` from pnpm, so the top-level
      # calls are the entry points. Scoped to this job: CI and local runs keep
      # the default. pnpm 11 reads only the `pnpm_config_*` spelling for this
      # setting; `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Vite+, the pnpm that `packageManager` pins, and an EXACT Node:
      # 26.13.1 (LTS) bundles npm 11.20.0, and the root `release` script
      # publishes each `pnpm pack` tarball with the npm CLI, whose OIDC
      # trusted publishing needs npm >= 11.5.1. Exact rather than a range, so
      # what runs in this id-token job is a reviewed Node and npm, not
      # whatever is newest on the day. Bump it by hand; Dependabot does not
      # see it.
      #
      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips the root `prepare` (the Vite+ git hooks), which nothing here needs.
      # It only holds because `pnpm_config_verify_deps_before_run` is off for
      # this job (see the job `env` above); otherwise a later `pnpm run` /
      # `pnpm exec` could re-install with scripts.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '26.13.1'
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']

      # Fails before anything is published if the npm on PATH is not the
      # one the Node pin above bundles.
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      # `files` is `["dist"]` in every package, so a stale or missing build
      # publishes an empty package rather than failing — build here, before
      # the action decides whether this push versions or publishes.
      # Through `pnpm exec`, which puts node_modules/.bin on PATH for the
      # command (writing it to GITHUB_PATH is zizmor's `github-env` finding).
      - name: Build
        run: pnpm exec vp run -r build

      # Once the version PR has merged (no changesets remain), this runs `pnpm
      # run release` (scripts/release.sh), which skips any package already on
      # npm at its version, packs the rest with `pnpm pack
      # --config.ignore-scripts=true` (rewriting `workspace:*` and `catalog:`
      # specifiers to real ranges — a thing `npm publish` on the source tree
      # would not do), publishes each tarball with `npm publish` (OIDC trusted
      # publishing — there is no NPM_TOKEN to steal) and then runs `changeset
      # tag`. The action parses the "New tag:" output, pushes the tags and
      # creates the GitHub releases.
      #
      # Provenance is left to npm: with no explicit provenance setting, npm
      # (>= 11.5.1, under trusted publishing) attaches it only when the OIDC
      # token reports a public repository AND the registry reports the
      # package as public. This repository is private, so there is no
      # provenance today. Do not force it: `NPM_CONFIG_PROVENANCE=true` or
      # `--provenance` is read by the npm CLI and makes the publish FAIL from
      # a private repository.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
