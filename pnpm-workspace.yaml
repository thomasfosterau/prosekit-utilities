# Every external version lives in this catalog (`catalogMode: strict`).
# After editing it, run `vp install` and commit pnpm-lock.yaml.
packages:
  - packages/*

catalogMode: strict

catalog:
  '@changesets/cli': ^3.0.3
  # `prepare` patches `tsc` and vite-plus's oxlint with this; it supports only
  # specific versions, so it moves with `@typescript/native` and `vite-plus`
  # (see the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs).
  '@effect/tsgo': 0.68.0
  '@effect/vitest': 4.1.4
  '@enfect/oxlint': 0.10.0
  '@prosekit/pm': ^0.1.21
  '@storybook/addon-a11y': ^10.6.7
  '@storybook/addon-svelte-csf': ^5.1.6
  '@storybook/sveltekit': ^10.6.7
  '@sveltejs/kit': 3.2.0
  '@sveltejs/package': 3.0.2
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.5
  '@testing-library/jest-dom': ^7.0.1
  '@types/node': ^26.6.6
  # TS7 (bin `tsc`) for the core's type check; svelte-check and the
  # declaration emit need the TS6 JS API (`typescript` below).
  '@typescript/native': npm:typescript@7.0.2
  '@vitest/browser-playwright': 5.1.0
  '@vitest/coverage-istanbul': 5.1.0
  '@xyflow/svelte': ^2.0.2
  bits-ui: ^2.21.0
  daisyui: ^5.8.1
  # Peer of `./drizzle` only.
  drizzle-orm: 1.0.0-rc.5
  # A peer of every package that uses it, never a dependency.
  effect: 4.1.4
  fallow: 3.42.0
  happy-dom: ^21.0.4
  # The server-side DOM the HTML renderer imports when there is no
  # `document`; happy-dom needs `node:*` modules workerd lacks.
  linkedom: ^0.18.15
  # Only the Vitest browser provider uses it. CI installs its Chromium
  # revision; elsewhere set PLAYWRIGHT_CHROMIUM_EXECUTABLE (docs/CONTRIBUTING.md).
  playwright: 1.65.0
  # The packages' peer ranges are literal (`^0.23.0` / `^0.1.21`): raise them
  # with this minor.
  prosekit: ^0.23.1
  storybook: ^10.6.7
  svelte-check: ^4.7.8
  svelte: ^5.57.3
  tailwindcss: ^4.3.5
  # TS6 JS compiler (bin `tsc6`), for svelte-check and declaration emit.
  typescript: npm:@typescript/typescript6@6.0.2
  # vite-plus pins `vitest` / `@vitest/*` exactly: keep them, and `vite` (its
  # aliased core), equal to its pin.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vitest-browser-svelte: ^3.1.0

overrides:
  # Singletons: two copies of `effect` or `svelte` break runtime identity.
  effect: 'catalog:'
  svelte: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@sveltejs/kit': 'catalog:'
  # A stored document decodes identically only while the ProseMirror model it
  # was derived from is the same, so these move only by the owner's decision.
  prosemirror-model: 1.25.7
  # 1.42.3 fixes GHSA-c8x8-7fp4-3x9w.
  prosemirror-view: 1.42.3

nodeLinker: hoisted

# `playwright` is absent on purpose: its postinstall downloads a browser.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: false

# Storybook and its addons lag the 1.x Vite+ toolchain in their peer ranges.
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
    - '@sveltejs/kit'
  allowedVersions:
    vite: '*'
    vite-plus: '*'
    vitest: '*'
    '@sveltejs/kit': '*'

# Hold new releases for 8 hours (minutes).
minimumReleaseAge: 480
